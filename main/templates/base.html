{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}My Shop{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_css %}{% endblock %}
    <style>
        .alert {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid;
            font-size: 14px;
        }

        /* Success */
        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }

        /* Error */
        .alert-error,
        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #ef4444;
        }

        /* Warning */
        .alert-warning {
            background-color: #fef3c7;
            color: #92400e;
            border-color: #f59e0b;
        }

        /* Info */
        .alert-info {
            background-color: #dbeafe;
            color: #1e40af;
            border-color: #3b82f6;
        }

        /* Close button */
        .close-btn {
            background: none;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: inherit;
            padding: 0 5px;
        }

        .close-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Flash Messages -->
    <div class="container mt-3">
        {% include 'includes/messages.html' %}
    </div>

    <!-- Main Content -->
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{% static '/js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
