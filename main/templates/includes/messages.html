{% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            <span>{{ message }}</span>
            <button type="button" class="close-btn" onclick="this.parentElement.remove()">
                &times;
            </button>
        </div>
        {% endfor %}
    </div>
{% endif %}
