{% extends 'base.html' %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<h1 class="mb-4">{{ product.name }}</h1>

<div class="row">

   

        <div class="col-md-12 mb-4">

            <div class="card h-100">

                <img src="{{ product.image.url }}"
                     class="card-img-top"
                     alt="{{ product.name }}">

                <div class="card-body">

                    <h5>{{ product.name }}</h5>

                    <p>₹{{ product.price }}</p>

                </div>
                <p>{{ product.description }}
                <p>
                    <a href="{% url 'add_to_cart' product.slug %}?next={{ request.path }}"
                        class="btn btn-primary"> 
                            Add to Cart
                        </a>

                </p>
            </div>

        </div>

 

</div>

{% endblock %}
