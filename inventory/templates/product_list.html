{% extends 'base.html' %}

{% block title %}
Products
{% endblock %}

{% block content %}

<h1 class="mb-4">All Products</h1>

<div class="row">

    {% for product in products %}

        <div class="col-md-3 mb-4">

            <div class="card h-100">

                <img src="{{ product.image.url }}"
                     class="card-img-top"
                     alt="{{ product.name }}">

                <div class="card-body">

                    <h5>{{ product.name }}</h5>

                    <p>₹{{ product.price }}</p>

                    <a href="{% url 'product_detail' product.slug %}"
                       class="btn btn-primary"> 

                        View Product
                    </a>

                </div>
            </div>

        </div>

    {% endfor %}

</div>

{% endblock %}
